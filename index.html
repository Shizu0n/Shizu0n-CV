<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=BigP" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paulo Shizuo, Computer Science student at UNIFOR building AI systems (agents, RAG, fine-tuning, evaluation) and full-stack applications. Looking for an internship."
    />
    <meta name="theme-color" content="#0e0d0c" />
    <!-- Link previews (LinkedIn, Slack, WhatsApp). The image comes from scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shizu0n.vercel.app/" />
    <meta property="og:title" content="Paulo Shizuo, Computer Science student" />
    <meta
      property="og:description"
      content="Computer Science student at UNIFOR building AI systems (agents, RAG, fine-tuning, evaluation) and full-stack applications. Looking for an internship."
    />
    <meta property="og:image" content="https://shizu0n.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paulo Shizuo, Computer Science student, with three measured project results." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Dark unless the visitor chose light; applied before the first paint.
      try { if (localStorage.getItem('theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#e6e1d8' } } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif:wght@400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Paulo Shizuo, Computer Science student</title>
  </head>
